services:
  db:
    image: mariadb:11
    container_name: wp-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wpuser
      MARIADB_PASSWORD: wppassword
      MARIADB_ROOT_PASSWORD: rootpassword
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - wp-network
  wordpress:
    build: .
    container_name: wp-web
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8081:80"
    volumes:
      - wp_data:/var/www/html
    networks:
      - wp-network
volumes:
  db_data:
  wp_data:
networks:
  wp-network:
    driver: bridge
